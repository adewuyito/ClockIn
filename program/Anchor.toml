# Added by hand (not `anchor init`) — the program under programs/reputation was
# scaffolded manually and is normally built with `cargo build-sbf`. This file
# just gives the Anchor CLI a workspace to operate on for `anchor build` /
# `anchor test` / `anchor deploy`.
#
# The program keypair lives at program/reputation-keypair.json (gitignored,
# devnet only). `anchor build` looks for target/deploy/reputation-keypair.json,
# so on a fresh checkout copy it there first:
#   mkdir -p target/deploy && cp reputation-keypair.json target/deploy/

[toolchain]
anchor_version = "1.2.0"

[features]
resolution = true
skip-lint = false

[programs.localnet]
reputation = "FKicZKbepmiwj2rTnPrHNRBPAja3G5gSvi7KFkjHdEt9"

[programs.devnet]
reputation = "FKicZKbepmiwj2rTnPrHNRBPAja3G5gSvi7KFkjHdEt9"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 10000
