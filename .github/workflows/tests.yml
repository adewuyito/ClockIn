name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  flutter:
    name: Flutter app (analyze + 176 tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      # Analyze these paths only; a bare `flutter analyze` also walks build/.
      - run: flutter analyze lib/ test/
      - run: flutter test --reporter expanded

  firestore-rules:
    name: Firestore rules (33 tests, emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: firestore-tests
      - run: npm install -g firebase-tools
      - name: Run rules tests against the Firestore emulator
        run: >
          firebase emulators:exec --only firestore --project clockin-rules-test
          "node firestore-tests/node_modules/mocha/bin/mocha.js --timeout 20000 firestore-tests/rules.test.js"
        env:
          CI: "true"

# The Anchor program suite (39 tests) needs the Solana and Anchor toolchains and
# a local validator, so it is not run here. Its recorded output is in
# docs/test-evidence/anchor-test.log, and docs/VERIFICATION.md has the commands
# to reproduce it.
